name: secretary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: secretary-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # steps の if では secrets コンテキストが使えないため、job env に落としてから参照する
      CLAUDE_TOKEN_SET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      BRAIN_TOKEN_SET: ${{ secrets.BRAIN_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # 脳（persona/config/state）は別リポジトリ（private・slack-secretary-brain）。
      # Fine-grained PAT（BRAIN_REPO_TOKEN）が未設定ならcheckoutごとスキップし、
      # 以降の実行ステップ・stateコミットステップも正常にスキップして終了する
      - name: 脳リポジトリ(slack-secretary-brain)をcheckout
        if: ${{ env.BRAIN_TOKEN_SET == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: groundcobra009/slack-secretary-brain
          token: ${{ secrets.BRAIN_REPO_TOKEN }}
          path: brain

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ランタイム依存ゼロのプロジェクトのためnpm installは軽量（devDependencies無し）
      - run: npm install --no-audit --no-fund

      # 返信生成は claude -p を使うため、Secretsが設定されている場合のみCLIを入れる
      - name: Claude Code CLI をインストール
        if: ${{ env.CLAUDE_TOKEN_SET == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      # BRAIN_REPO_TOKEN未設定時はbrain/が存在しないためスキップする
      # （設定済みでも他のSecrets未設定なら run.js 側がワークスペースごとにSKIPして正常終了する）
      - name: Run けいたろう秘書
        if: ${{ env.BRAIN_TOKEN_SET == 'true' }}
        env:
          BRAIN_DIR: brain
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_BOT_TOKEN_MAIN: ${{ secrets.SLACK_BOT_TOKEN_MAIN }}
          SLACK_USER_TOKEN_MAIN: ${{ secrets.SLACK_USER_TOKEN_MAIN }}
          SLACK_USER_ID_MAIN: ${{ secrets.SLACK_USER_ID_MAIN }}
          GCAL_ICS_URL: ${{ secrets.GCAL_ICS_URL }}
        run: node src/run.js

      - name: state変更をbrainリポジトリへコミット・push
        if: ${{ env.BRAIN_TOKEN_SET == 'true' }}
        working-directory: brain
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore(state): update last_seen [skip ci]"
            git push
          else
            echo "state変更なし。コミットをスキップします。"
          fi
