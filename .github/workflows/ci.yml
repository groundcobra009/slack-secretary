name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test のglobパターンは v21+ が必要（v20だと0件マッチで失敗）
          node-version: "22"
      - run: npm test
